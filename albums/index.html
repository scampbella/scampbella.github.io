<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Albums of the Week | Scott Campbell</title>
    <meta name="description" content="Previous albums of the week from Scott Campbell's rotation.">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Geist:wght@100..900&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tailwind.css">
</head>

<body class="bg-background text-on-background font-body-md overflow-x-hidden">
    <header class="fixed top-0 w-full z-50 bg-background border-b border-outline-variant/30">
        <nav class="items-center max-w-container-max mx-auto px-margin-desktop py-4 transition-all duration-300 flex">
            <a href="../" class="font-headline-md text-headline-md font-bold tracking-tighter text-on-surface flex-1 uppercase hover:text-primary transition-colors">SC</a>
            <div class="flex items-center gap-10">
                <div class="hidden md:flex items-center gap-10">
                    <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md" href="../">Home</a>
                    <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md" href="../blogs/">Blog</a>
                    <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md" href="../games/">Games</a>
                </div>
            </div>
        </nav>
    </header>
    <main class="pt-[160px] pb-section-gap max-w-container-max mx-auto px-margin-desktop min-h-screen">
        <header class="mb-section-gap">
            <h1 class="font-display-lg text-[80px] md:text-[120px] leading-[0.9] mb-6 tracking-[-0.05em] font-extrabold text-on-surface uppercase">Albums of the Week</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl leading-relaxed">Every album that's been featured as Album of the Week. A running log of what I've been listening to.</p>
        </header>

        <!-- Sort Controls -->
        <div class="flex flex-wrap items-center gap-3 mb-10">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mr-1">Sort by</span>
            <button data-field="date" class="sort-field-btn flex items-center gap-1.5 px-5 py-2.5 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md active-sort-field">
                <span class="material-symbols-outlined text-[18px]">today</span> Date Added
            </button>
            <button data-field="name" class="sort-field-btn flex items-center gap-1.5 px-5 py-2.5 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md">
                <span class="material-symbols-outlined text-[18px]">sort_by_alpha</span> Name
            </button>
            <button data-field="releaseDate" class="sort-field-btn flex items-center gap-1.5 px-5 py-2.5 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md">
                <span class="material-symbols-outlined text-[18px]">calendar_month</span> Release Date
            </button>
            <button data-field="durationMs" class="sort-field-btn flex items-center gap-1.5 px-5 py-2.5 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md">
                <span class="material-symbols-outlined text-[18px]">schedule</span> Length
            </button>
            <button data-field="artist" class="sort-field-btn flex items-center gap-1.5 px-5 py-2.5 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md">
                <span class="material-symbols-outlined text-[18px]">artist</span> Artist
            </button>
            <button id="sort-dir-toggle" class="flex items-center gap-1 px-3 py-2.5 rounded-full border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-all font-label-md text-label-md" aria-label="Toggle sort direction" title="Toggle ascending / descending">
                <span class="material-symbols-outlined text-[20px] sort-dir-icon">arrow_downward</span>
            </button>
        </div>

        <section id="album-list" class="flex flex-col gap-8">
            <p class="text-on-surface-variant font-body-md py-8" id="album-list-loading">Loading albums…</p>
        </section>

        <div id="empty-state" class="hidden text-center py-20">
            <span class="material-symbols-outlined text-[64px] text-outline-variant mb-4 block">album</span>
            <p class="font-body-lg text-on-surface-variant">No albums match this filter.</p>
        </div>
    </main>

    <footer class="w-full py-12 bg-surface-container-lowest border-t border-outline-variant/30">
        <div class="max-w-container-max mx-auto px-margin-desktop flex flex-col items-center gap-8">
            <div class="flex flex-wrap justify-center gap-8 text-on-surface-variant font-label-md">
                <a class="hover:text-primary transition-colors duration-200" href="https://www.linkedin.com/in/scott-campbell-891547381/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a class="hover:text-primary transition-colors duration-200" href="https://github.com/scampbella" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a class="hover:text-primary transition-colors duration-200" href="../assets/scottcampbell.pdf" download>Resume</a>
                <a class="hover:text-primary transition-colors duration-200" href="mailto:mail@scottcampbell.me">Email</a>
            </div>
            <div class="text-[11px] uppercase tracking-widest text-on-surface-variant/60 font-label-sm text-center">
                © <span id="year">2026</span> SCOTT CAMPBELL
                <div class="italic" style="text-transform: none; margin-top: 4px; color: var(--ct-on-surface-variant); opacity: 0.8;">Optimized for <span style="letter-spacing: 0.25em; font-weight: bold; margin-right: -0.25em;">OLED</span></div>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
    var albums = [
        {
            name: "Blue Banisters",
            artist: "Lana Del Rey",
            date: "2026-06-01",
            releaseDate: "2021-10-22",
            durationMs: 3699000,
            coverJpg: "../assets/images/albums/blue-banisters.jpg",
            coverAvifMd: "../assets/images/albums/blue-banisters-md.avif",
            coverAvifSm: "../assets/images/albums/blue-banisters-sm.avif",
            spotify: "https://open.spotify.com/album/2wwCc6fcyhp1tfY3J6Javr",
            blurb: "This week I decided to go with an album that is pretty special to me. I listened to a lot of different music in high school, but this album specifically stuck with me. I am really fond of music with strong vocals, and what this album lacks in lyricism and interesting storytelling, it definitely makes up for in the voice department. While some may call me performative, I really connected with Lana\u2019s music growing up, and this album is probably my favorite out of all of hers. From <i>Arcadia</i> to <i>Cherry Blossom</i>, this whole project has so many different comforting songs that are genuinely just <i>Beautiful</i> to me."
        },
        {
            name: "Hurry Up Tomorrow",
            artist: "The Weeknd",
            date: "2026-05-25",
            releaseDate: "2025-01-31",
            durationMs: 5064000,
            coverJpg: "../assets/images/albums/hurryuptomorrow.jpg",
            coverAvifMd: "../assets/images/albums/hurryuptomorrow-md.avif",
            coverAvifSm: "../assets/images/albums/hurryuptomorrow-sm.avif",
            spotify: "https://open.spotify.com/album/3OxfaVgvTxUTy7276t7SPU",
            blurb: "This week's pick is an album that suffers from some serious recency bias. It is no question one of The Weeknd's best (and longest) albums to date. While this album has some seriously amazing songs like Big Sleep and Hurry Up Tomorrow, it definitely has some stinkers too. I'd say this is definitely worth a listen, especially for those who still think The Weeknd is \"co-worker music.\""
        }
    ];

    var listEl = document.getElementById("album-list");
    var emptyEl = document.getElementById("empty-state");
    var currentField = "date";
    var currentDir = "desc";

    function fmtDate(dateStr) {
        return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", {
            year: "numeric", month: "long", day: "numeric"
        });
    }

    function fmtDuration(ms) {
        if (!ms) return "";
        var m = Math.floor(ms / 60000);
        var s = Math.floor((ms % 60000) / 1000);
        return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function esc(s) { return s.replace(/"/g, "&quot;"); }

    function buildAlbumCard(album) {
        var article = document.createElement("article");
        article.className = "flex flex-col md:flex-row items-start p-8 gap-10 album-card border-2 border-on-surface/20 rounded-[32px]";

        article.innerHTML =
            '<div class="w-full md:w-[320px] aspect-square flex-shrink-0 rounded-2xl overflow-hidden bg-primary-container">' +
                '<picture class="w-full h-full block">' +
                    '<source srcset="' + esc(album.coverAvifSm) + '" media="(max-width: 640px)" type="image/avif">' +
                    '<source srcset="' + esc(album.coverAvifMd) + '" type="image/avif">' +
                    '<img alt="' + esc(album.name) + ' album cover" class="w-full h-full object-cover" src="' + esc(album.coverJpg) + '">' +
                '</picture>' +
            '</div>' +
            '<div class="flex flex-col justify-center flex-grow min-w-0">' +
                '<div class="flex items-center gap-3 mb-4">' +
                    '<time class="font-label-sm text-label-sm text-primary uppercase tracking-widest">' + fmtDate(album.date) + '</time>' +
                    '<span class="w-1 h-1 rounded-full bg-outline-variant"></span>' +
                    '<span class="font-label-sm text-label-sm text-on-surface-variant">Album of the Week</span>' +
                '</div>' +
                '<h2 class="font-headline-lg text-headline-lg md:text-[36px] text-on-surface mb-1 leading-tight">' + esc(album.name) + '</h2>' +
                '<p class="text-on-surface-variant font-body-md italic text-lg mb-2">by ' + esc(album.artist) + '</p>' +
                '<p class="font-label-sm text-on-surface-variant/70 mb-6">Released ' + fmtDate(album.releaseDate) + ' &middot; ' + fmtDuration(album.durationMs) + '</p>' +
                '<div class="blurb-container mb-6">' +
                    '<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed blurb-preview line-clamp-2">' + esc(album.blurb) + '</p>' +
                    '<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed blurb-full hidden">' + esc(album.blurb) + '</p>' +
                    '<button class="read-more-btn flex items-center gap-1.5 font-label-sm text-label-sm text-primary hover:underline mt-2 transition-colors" aria-expanded="false">' +
                        '<span class="read-more-text">Read more</span>' +
                        '<span class="material-symbols-outlined text-[16px] read-more-icon">expand_more</span>' +
                    '</button>' +
                '</div>' +
                '<div class="flex flex-wrap items-center gap-4">' +
                    '<a class="flex items-center gap-2 font-label-md text-primary hover:underline group w-fit" href="' + esc(album.spotify) + '" target="_blank" rel="noopener noreferrer">' +
                        'Listen on Spotify' +
                        '<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>' +
                    '</a>' +
                '</div>' +
            '</div>';
        return article;
    }

    function renderAlbums(sortedAlbums) {
        var loadingEl = document.getElementById("album-list-loading");
        if (loadingEl) loadingEl.remove();
        listEl.innerHTML = "";
        if (sortedAlbums.length === 0) {
            emptyEl.classList.remove("hidden");
            return;
        }
        emptyEl.classList.add("hidden");
        for (var i = 0; i < sortedAlbums.length; i++) {
            listEl.appendChild(buildAlbumCard(sortedAlbums[i]));
        }
        wireReadMoreButtons();
    }

    function wireReadMoreButtons() {
        var buttons = document.querySelectorAll(".read-more-btn");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener("click", function () {
                var container = this.closest(".blurb-container");
                var preview = container.querySelector(".blurb-preview");
                var full = container.querySelector(".blurb-full");
                var text = this.querySelector(".read-more-text");
                var icon = this.querySelector(".read-more-icon");
                var expanded = this.getAttribute("aria-expanded") === "true";

                if (expanded) {
                    preview.classList.remove("hidden");
                    full.classList.add("hidden");
                    text.textContent = "Read more";
                    icon.textContent = "expand_more";
                    this.setAttribute("aria-expanded", "false");
                } else {
                    preview.classList.add("hidden");
                    full.classList.remove("hidden");
                    text.textContent = "Read less";
                    icon.textContent = "expand_less";
                    this.setAttribute("aria-expanded", "true");
                }
            });
        }
    }

    function sortAlbums() {
        var sorted = albums.slice();
        var dir = currentDir === "asc" ? 1 : -1;
        if (currentField === "name") {
            sorted.sort(function (a, b) { return dir * a.name.localeCompare(b.name); });
        } else if (currentField === "date") {
            sorted.sort(function (a, b) { return dir * (new Date(a.date) - new Date(b.date)); });
        } else if (currentField === "releaseDate") {
            sorted.sort(function (a, b) { return dir * (new Date(a.releaseDate) - new Date(b.releaseDate)); });
        } else if (currentField === "durationMs") {
            sorted.sort(function (a, b) { return dir * ((a.durationMs || 0) - (b.durationMs || 0)); });
        } else if (currentField === "artist") {
            sorted.sort(function (a, b) { return dir * a.artist.localeCompare(b.artist); });
        }
        renderAlbums(sorted);
    }

    function updateSortUI() {
        var fieldBtns = document.querySelectorAll(".sort-field-btn");
        for (var i = 0; i < fieldBtns.length; i++) {
            var btn = fieldBtns[i];
            if (btn.dataset.field === currentField) {
                btn.classList.add("active-sort-field");
            } else {
                btn.classList.remove("active-sort-field");
            }
        }
        var icon = document.querySelector(".sort-dir-icon");
        if (icon) icon.textContent = currentDir === "asc" ? "arrow_upward" : "arrow_downward";
    }

    var fieldBtns = document.querySelectorAll(".sort-field-btn");
    for (var i = 0; i < fieldBtns.length; i++) {
        fieldBtns[i].addEventListener("click", function () {
            if (currentField === this.dataset.field) {
                currentDir = currentDir === "asc" ? "desc" : "asc";
            } else {
                currentField = this.dataset.field;
            }
            updateSortUI();
            sortAlbums();
        });
    }

    var dirToggle = document.getElementById("sort-dir-toggle");
    if (dirToggle) {
        dirToggle.addEventListener("click", function () {
            currentDir = currentDir === "asc" ? "desc" : "asc";
            updateSortUI();
            sortAlbums();
        });
    }

    updateSortUI();
    sortAlbums();
    </script>
</body>

</html>
