<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyClicker: Resurrected</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <!-- Header Bar -->
    <header class="top-bar">
        <h1 class="game-title">PyClicker: Resurrected</h1>
        <div class="currency-bar">
            <span class="currency gold"><span class="icon">🪙</span> Gold: <strong id="gold-display">0</strong></span>
        </div>
    </header>

    <!-- Zone Tabs -->
    <nav id="area-tabs" class="area-tabs"></nav>

    <!-- Main Layout -->
    <main class="game-layout">

        <!-- Left: Goblin Shop -->
        <aside class="panel shop-panel">
            <h2 class="panel-title">🛒 Goblin Shop</h2>
            <p class="shopkeeper">"Buy somethin', will ya?"</p>
            <div class="shop-tabs" id="shop-tabs">
                <button class="shop-tab active" data-shop-tab="pickaxes">⛏️ Pickaxes</button>
                <button class="shop-tab" data-shop-tab="miners">🤖 Miners</button>
                <button class="shop-tab" data-shop-tab="areas">🌍 Areas</button>
            </div>
            <div id="shop-content" class="shop-content"></div>
        </aside>

        <!-- Center: Mining Area -->
        <section class="panel mine-panel">
            <div class="area-label" id="area-label">The Surface</div>
            <div id="ore-container" class="ore-zone">
                <div id="ore-sprite" class="ore-sprite">🟤</div>
                <div class="hp-bar-outer">
                    <div id="hp-bar-fill" class="hp-bar-fill"></div>
                </div>
                <p id="hp-text" class="hp-text">50 / 50 HP</p>
            </div>
            <p class="click-hint">🖱️ Click the ore to mine it!</p>
            <p id="damage-fly" class="damage-fly"></p>
            <p id="loot-fly" class="loot-fly"></p>
            <div class="auto-miner-info" id="auto-miner-info">
                <span>🤖 Auto-Miners: <strong id="auto-dps-display">0</strong> DPS</span>
            </div>
        </section>

        <!-- Right: Stats + Inventory -->
        <aside class="panel stats-panel">
            <h2 class="panel-title">⚒️ Player</h2>
            <div class="stat-row"><span>Level</span> <strong id="level-display">1</strong></div>
            <div class="xp-bar-outer">
                <div id="xp-bar-fill" class="xp-bar-fill"></div>
            </div>
            <p class="xp-text"><span id="xp-current">0</span> / <span id="xp-needed">100</span> XP</p>
            <div class="stat-row"><span>Pickaxe Power</span> <strong id="pickaxe-display">1</strong></div>

            <hr class="divider">

            <h2 class="panel-title">🎒 Inventory</h2>
            <div id="inventory-list" class="inventory-list"></div>
            <button id="sell-all-btn" class="sell-all-btn">💰 Sell All Ores</button>

            <hr class="divider">

            <button id="reset-btn" class="reset-button">🔥 Hard Reset</button>
        </aside>

    </main>

    <!-- Offline Progress Modal -->
    <div id="offline-overlay" class="offline-overlay">
        <div class="offline-modal">
            <h2 class="offline-title">⛏️ Welcome Back!</h2>
            <p class="offline-time">You were away for <strong id="offline-time">--</strong></p>
            <p class="offline-ores" id="offline-ores"></p>
            <p class="offline-xp" id="offline-xp"></p>
            <button id="offline-close" class="offline-close-btn">🪙 Collect Loot & Continue</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
