<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A mining clicker game. Break ores, sell loot, buy upgrades, explore new areas!">
    <meta property="og:title" content="Mining Clicker | Scott Campbell">
    <meta property="og:description" content="A mining clicker game. Break ores, sell loot, buy upgrades, explore new areas!">
    <meta property="og:image" content="https://scampbella.github.io/favicon.svg">
    <meta property="og:url" content="https://scampbella.github.io/games/clicker/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://scampbella.github.io/games/clicker/">
    <title>Mining Clicker | Scott Campbell</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
</head>
<body>
    <a href="#center-panel" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[60] focus:px-4 focus:py-2 focus:bg-primary focus:text-on-primary focus:rounded-full">Skip to content</a>
    <div id="game-container">
        <!-- TOP: Zone Bar -->
        <header id="zone-bar">
            <div class="zones-container" id="zones-container">
                <!-- Zones injected via JS -->
            </div>
        </header>

        <!-- RIGHT: Shop -->
        <aside id="right-panel">
            <h2>Shop</h2>
            <div class="shop-item" id="pickaxe-upgrade">
                <h3>Upgrade Pickaxe</h3>
                <div class="sprite-display">
                    <div class="pickaxe-shape"></div>
                </div>
                <p>Level: <span id="pickaxe-level-display">1</span></p>
                <button id="upgrade-pickaxe-btn"><span id="pickaxe-cost-display">Cost: 10 Gold</span></button>
            </div>

            <div id="miners-shop" style="display: none;">
                <h3>Miners</h3>
                
                <div class="shop-item miner-item" id="buy-goblin-container">
                    <div class="sprite-title">
                        <h4>Goblin</h4>
                        <div class="goblin-shape sprite-icon"></div>
                    </div>
                    <p>Yield: 1 Ore / 5s</p>
                    <p>Owned: <span id="goblin-count">0</span> / <span id="goblin-limit">0</span></p>
                    <button id="buy-goblin-btn">Cost: <span id="goblin-cost">300</span> Gold</button>
                </div>

                <div class="shop-item miner-item" id="buy-dwarf-container" style="display: none;">
                    <div class="sprite-title">
                        <h4>Dwarf</h4>
                        <div class="dwarf-shape sprite-icon"></div>
                    </div>
                    <p>Yield: 1 Ore / 2.5s</p>
                    <p>Owned: <span id="dwarf-count">0</span> / <span id="dwarf-limit">0</span></p>
                    <button id="buy-dwarf-btn">Cost: <span id="dwarf-cost">---</span> Gold</button>
                </div>

                <div class="shop-item miner-item" id="buy-drill-container" style="display: none;">
                    <div class="sprite-title">
                        <h4>Drill</h4>
                        <div class="drill-shape sprite-icon"></div>
                    </div>
                    <p>Yield: 1 Ore / 1s</p>
                    <p>Owned: <span id="drill-count">0</span> / <span id="drill-limit">0</span></p>
                    <button id="buy-drill-btn">Cost: <span id="drill-cost">---</span> Gold</button>
                </div>
            </div>
        </aside>

        <!-- CENTER: The Rock -->
        <main id="center-panel">
            <div class="mining-stats">
                <p>Active: <span id="opc-display">1</span> Ore/Click</p>
                <p>Passive: <span id="ops-display">0</span> Ore/Minute</p>
                <div id="active-buffs" class="active-buffs-container"></div>
            </div>
            
            <div id="mother-lode-container">
                <div id="mother-lode" class="rock-shape"></div>
            </div>
            
            <!-- Background piles for miners -->
            <div id="miner-piles"></div>

            <!-- Powerup container -->
            <div id="powerup-container"></div>
        </main>

        <!-- LEFT: Inventory & Selling -->
        <aside id="left-panel">
            <h2>Inventory</h2>
            <div class="stats-box">
                <p style="display: flex; align-items: center; gap: 8px; justify-content: space-between;">
                    <span>Gold:</span>
                    <span style="display: flex; align-items: center; gap: 4px;">
                        <span id="gold-display" style="font-weight: bold;">0</span>
                        <span class="coin"></span>
                    </span>
                </p>
            </div>
            
            <div id="inventory-list">
                <!-- Ore inventory injected via JS with individual sell buttons -->
            </div>

            <button id="sell-all-btn" class="sell-all-btn" style="margin-top: 10px; margin-bottom: 10px;">💰 Sell All Ores</button>
            <button id="reset-game-btn" style="margin-top:auto; font-size: 0.8rem; background: #5c1818; border-color: #3b0e0e;">Hard Reset Game</button>
        </aside>
    </div>

    <!-- Dev Tools -->
    <div id="dev-tools-toggle">⚙️ Dev Tools</div>
    <div id="dev-tools-panel" style="display: none;">
        <h3>Developer Tools</h3>
        <div>
            <label for="dev-gold">Gold:</label>
            <input type="number" id="dev-gold" value="0">
            <button id="dev-set-gold">Set Gold</button>
        </div>
        <div>
            <label for="dev-pickaxe">Pickaxe Lvl:</label>
            <input type="number" id="dev-pickaxe" value="1">
            <button id="dev-set-pickaxe">Set Pickaxe</button>
        </div>
        <div>
            <label for="dev-ore">Current Ore:</label>
            <input type="number" id="dev-ore" value="0">
            <button id="dev-set-ore">Set Ore</button>
        </div>
        <button id="dev-unlock-all">Unlock All Zones</button>
        <button id="dev-spawn-powerup" style="margin-top: 5px;">Spawn Power-up</button>
        <button id="dev-clear-powerups" style="margin-top: 5px;">Clear Power-ups/Buffs</button>
    </div>

    <script src="balance.js"></script>
    <script src="script.js"></script>
</body>
</html>
