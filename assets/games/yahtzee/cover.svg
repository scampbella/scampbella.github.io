<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
        <linearGradient id="bgYahtzee" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#991b1b"/>
        </linearGradient>
        <filter id="shadow">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3"/>
        </filter>
    </defs>
    <rect width="400" height="400" fill="url(#bgYahtzee)"/>
    <!-- Dice 1 -->
    <g transform="translate(150, 150) rotate(-15)" filter="url(#shadow)">
        <rect width="100" height="100" rx="20" fill="#ffffff"/>
        <circle cx="30" cy="30" r="10" fill="#1f2937"/>
        <circle cx="70" cy="70" r="10" fill="#1f2937"/>
    </g>
    <!-- Dice 2 -->
    <g transform="translate(180, 220) rotate(20)" filter="url(#shadow)">
        <rect width="100" height="100" rx="20" fill="#ffffff"/>
        <circle cx="50" cy="50" r="10" fill="#ef4444"/>
    </g>
</svg>
