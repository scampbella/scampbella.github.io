<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
        <radialGradient id="feltGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#245c38" />
            <stop offset="100%" stop-color="#0e2b17" />
        </radialGradient>
        <filter id="shadow">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.5"/>
        </filter>
        <g id="pip">
            <circle r="6" fill="#1a1a1a" />
        </g>
        <g id="die-bg">
            <rect x="-40" y="-40" width="80" height="80" rx="16" fill="#f5f0e8" filter="url(#shadow)"/>
        </g>
        <g id="face1">
            <use href="#die-bg"/>
            <use href="#pip" x="0" y="0"/>
        </g>
        <g id="face2">
            <use href="#die-bg"/>
            <use href="#pip" x="-20" y="-20"/>
            <use href="#pip" x="20" y="20"/>
        </g>
        <g id="face3">
            <use href="#die-bg"/>
            <use href="#pip" x="-20" y="-20"/>
            <use href="#pip" x="0" y="0"/>
            <use href="#pip" x="20" y="20"/>
        </g>
        <g id="face4">
            <use href="#die-bg"/>
            <use href="#pip" x="-20" y="-20"/>
            <use href="#pip" x="20" y="-20"/>
            <use href="#pip" x="-20" y="20"/>
            <use href="#pip" x="20" y="20"/>
        </g>
        <g id="face5">
            <use href="#die-bg"/>
            <use href="#pip" x="-20" y="-20"/>
            <use href="#pip" x="20" y="-20"/>
            <use href="#pip" x="0" y="0"/>
            <use href="#pip" x="-20" y="20"/>
            <use href="#pip" x="20" y="20"/>
        </g>
        <g id="face6">
            <use href="#die-bg"/>
            <use href="#pip" x="-20" y="-25"/>
            <use href="#pip" x="20" y="-25"/>
            <use href="#pip" x="-20" y="0"/>
            <use href="#pip" x="20" y="0"/>
            <use href="#pip" x="-20" y="25"/>
            <use href="#pip" x="20" y="25"/>
        </g>
    </defs>
    <rect width="400" height="400" fill="url(#feltGrad)"/>
    
    <!-- Dice placement -->
    <use href="#face5" transform="translate(140, 100) rotate(-15)" />
    <use href="#face2" transform="translate(280, 110) rotate(25)" />
    <use href="#face6" transform="translate(220, 220) rotate(5)" />
    <use href="#face4" transform="translate(100, 260) rotate(-35)" />
    <use href="#face3" transform="translate(300, 300) rotate(45)" />
</svg>
