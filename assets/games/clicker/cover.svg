<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
        <linearGradient id="bgClicker" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1e3a8a"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="400" height="400" fill="url(#bgClicker)"/>
    <!-- Sword -->
    <g transform="translate(200, 200) rotate(45) translate(-200, -200)">
        <rect x="190" y="80" width="20" height="160" fill="#e2e8f0"/>
        <polygon points="190,80 200,40 210,80" fill="#cbd5e1"/>
        <rect x="150" y="240" width="100" height="20" rx="5" fill="#fbbf24"/>
        <rect x="190" y="260" width="20" height="60" fill="#78350f"/>
        <circle cx="200" cy="320" r="15" fill="#fbbf24"/>
    </g>
    <!-- Sparkles -->
    <circle cx="120" cy="120" r="5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="280" cy="100" r="8" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="100" cy="280" r="6" fill="#fbbf24" filter="url(#glow)"/>
</svg>
