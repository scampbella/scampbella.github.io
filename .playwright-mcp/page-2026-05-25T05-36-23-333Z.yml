        - heading "About me" [level=2] [ref=e59]
        - paragraph [ref=e60]: I like understanding the hidden mechanics behind the things people use every day.
      - generic [ref=e61]:
        - paragraph [ref=e62]: I am a part of the brand new Data Science program at OSU. Understanding how thing work is my forte, especially when it comes to the systems we interact with daily. You may not think about it much but how do trains always arrive within minutes of the scheduled time? How are map apps so accurate? How is this website so awesome?
        - paragraph [ref=e63]: I co-founded the Computer Hardware Club here at OSU and am the sitting vice-president and treasurer. We have weekly meetings ranging from in-depth workshops to fun community-building activities. I really enjoy being able to lead our club meetings, especially on the social side. I pride myself on this club being a safe space for anyone to hang out and chat about technology.
